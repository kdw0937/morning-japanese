<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 일본어</title>
<meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 일본어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 줄 목록형 학습지. 오늘 탭(날짜 이동) + 누적 탭(Day별 접기 목록 + 검색). 카드 대신 구분선 행 */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #151d28;
  --muted: #5c6877;
  --line: #d9e0e8;
  --accent: #2c4a9e;
  --accent-soft: #e3e9f8;
  --done: #2f7d57;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #181f28; --fg: #e5eaf1; --muted: #98a4b4;
    --line: #2a3441; --accent: #8fa9f2; --accent-soft: #212c47; --done: #6cc496;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #181f28; --fg: #e5eaf1; --muted: #98a4b4;
  --line: #2a3441; --accent: #8fa9f2; --accent-soft: #212c47; --done: #6cc496;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-ko); font-size: 15px; line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

header { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.date-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.date-jp { font-family: var(--f-jp); font-weight: 700; font-size: clamp(32px, 9vw, 46px); line-height: 1.1; letter-spacing: .02em; }
.date-ko { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:focus-visible, .say:focus-visible, .chk input:focus-visible, .search:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.tabs .btn { border: 0; border-radius: 0; }
.spacer { flex: 1; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--done); font-weight: 700; }
.search {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; width: 100%;
}
.hint { font-size: 12px; color: var(--muted); display: none; }
.quiz .hint { display: block; }

section { display: flex; flex-direction: column; margin-bottom: 22px; }
section:last-child { margin-bottom: 0; }
.sec-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--fg); flex-wrap: wrap; }
.sec-jp { font-family: var(--f-jp); font-weight: 700; font-size: 18px; }
.sec-ko { color: var(--muted); font-size: 13px; }
.sec-n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sec-note { margin-top: 8px; font-size: 13px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px;
  padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start;
}
.chk { padding-top: 6px; }
.chk input { width: 18px; height: 18px; accent-color: var(--done); cursor: pointer; margin: 0; }
.body { min-width: 0; }
.jp { font-family: var(--f-jp); font-weight: 700; font-size: 20px; line-height: 1.45; overflow-wrap: anywhere; }
.phrase .jp { font-size: 18px; }
.rd { font-family: var(--f-jp); color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
.ko { font-weight: 500; margin-top: 2px; }
.ex { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); }
.ex-jp { font-family: var(--f-jp); font-size: 14px; }
.ex-ko { font-size: 13px; color: var(--muted); }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); background: var(--accent-soft); border-radius: 6px; padding: 6px 10px; }
.say {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--accent); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.say:hover { border-color: var(--accent); }
.acts { display: flex; gap: 6px; }
.star {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.star:hover { border-color: var(--accent); color: var(--accent); }
.star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.star.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.star.on svg { fill: currentColor; }
.item.done .jp { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); text-decoration-thickness: 1.5px; }

details.day { border-bottom: 1px solid var(--line); }
details.day > summary {
  cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 14px 0; font-weight: 700;
}
details.day > summary::-webkit-details-marker { display: none; }
details.day > summary::before { content: "▸"; color: var(--muted); display: inline-block; width: 1em; }
details.day[open] > summary::before { content: "▾"; }
.day-n { font-variant-numeric: tabular-nums; color: var(--accent); }
.day-d { font-family: var(--f-jp); font-weight: 500; }
.day-c { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-body { padding-bottom: 8px; }

.quiz .item:not(.open) .hid { filter: blur(7px); user-select: none; }
.quiz .item:not(.open) .body { cursor: pointer; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .hid { transition: filter .15s; } }

/* standalone 앱용 보정 */
:root { color-scheme: light; }
html { background: var(--bg); }
body {
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
</style>


</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="eyebrow">出勤前の10分 · 업무 일본어</div>
    <div class="date-row">
      <div class="date-jp" id="dateJp"></div>
      <div class="date-ko" id="dateKo"></div>
    </div>
    <div class="bar">
      <div class="tabs">
        <button class="btn" id="tabDay" type="button" aria-pressed="true">오늘</button>
        <button class="btn" id="tabAll" type="button" aria-pressed="false">누적</button>
        <button class="btn" id="tabBook" type="button" aria-pressed="false">내 단어장</button>
      </div>
      <span id="dayNav" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="prev" type="button">← 전날</button>
        <button class="btn" id="next" type="button">다음날 →</button>
      </span>
      <button class="btn" id="quiz" type="button" aria-pressed="false">뜻 가리기</button>
      <button class="btn" id="copyBook" type="button" hidden>목록 복사</button>
      <span class="spacer"></span>
      <span class="progress" id="progress"></span>
    </div>
    <input class="search" id="q" type="search" placeholder="누적 검색 (일본어 · 읽기 · 뜻)" hidden>
    <div class="hint">가려진 항목을 누르면 읽는 법과 뜻이 보입니다.</div>
  </header>
  <div id="sections"></div>
  <footer id="foot"></footer>
</div>

var PER = { k: 3, j: 3, e: 3, b: 2, m: 1 };
var SECTIONS = [
  { key: "k", jp: "見込み系", ko: "전망·일정·조율 표현", type: "word",
    note: "見込み처럼 동사 어간이 그대로 명사가 된 말(転成名詞, 연용형 명사)과 전망·일정·조율 계열 단어입니다. 업무 메일과 회의에서 가장 자주 나옵니다." },
  { key: "j", jp: "業務用語", ko: "업무 한자어", type: "word" },
  { key: "e", jp: "実用表現", ko: "일상·직장 실전 문형", type: "phrase" },
  { key: "b", jp: "ビジネス会話", ko: "회의·전화·교섭", type: "phrase" },
  { key: "m", jp: "メール", ko: "메일 표현", type: "phrase" }
];
var TOTAL_DAYS = 20;
var START = new Date(2026, 9, 28, 12);
var WD = ["日","月","火","水","木","金","土"];
var offset = 0, view = "day", quiz = false;
var SPK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
var memSaved = null;
function savedList() {
  if (memSaved) return memSaved.slice();
  try { return JSON.parse(localStorage.getItem("ja2:saved") || "[]"); } catch (e) { return []; }
}
function setSaved(a) {
  memSaved = a.slice();
  try { localStorage.setItem("ja2:saved", JSON.stringify(a)); } catch (e) {}
}
function isSaved(id) { return savedList().indexOf(id) >= 0; }
function dayNum(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function dateAt(i) { return new Date(2026, 9, 28 + i, 12); }
function todayIdx() { return Math.max(0, dayNum(new Date()) - dayNum(START)); }
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v) localStorage.setItem(k, "1"); else localStorage.removeItem(k);
  } catch (e) { return null; }
}
function speak(t) {
  try {
    var u = new SpeechSynthesisUtterance(t.replace(/〇/g, "まる"));
    u.lang = "ja-JP"; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

function itemHTML(sec, idx, it) {
  var id = "ja2:" + sec.key + idx;
  var isDone = store(id) === "1";
  var detail = '<div class="rd">' + esc(it[1]) + '</div><div class="ko">' + esc(it[2]) + '</div>';
  if (sec.type === "word") detail += '<div class="ex"><div class="ex-jp">' + esc(it[3]) + '</div><div class="ex-ko">' + esc(it[4]) + '</div></div>';
  else detail += '<div class="note">' + esc(it[3]) + '</div>';
  var q = (it[0] + " " + it[1] + " " + it[2]).toLowerCase();
  return '<li class="item ' + sec.type + (isDone ? " done" : "") + '" data-id="' + id + '" data-jp="' + esc(it[0]) + '" data-q="' + esc(q) + '">' +
    '<label class="chk"><input type="checkbox" aria-label="외웠음"' + (isDone ? " checked" : "") + '></label>' +
    '<div class="body"><div class="jp">' + esc(it[0]) + '</div><div class="hid">' + detail + '</div></div>' +
    '<div class="acts"><button class="star' + (isSaved(id) ? " on" : "") + '" type="button" aria-label="내 단어장에 저장" aria-pressed="' + isSaved(id) + '">' + STAR + '</button>' +
    '<button class="say" type="button" aria-label="일본어로 듣기">' + SPK + '</button></div></li>';
}
function dayHTML(di, withNotes) {
  var html = "";
  SECTIONS.forEach(function (sec) {
    var pool = POOL[sec.key], n = PER[sec.key], items = "";
    for (var i = 0; i < n; i++) {
      var idx = (di * n + i) % pool.length;
      items += itemHTML(sec, idx, pool[idx]);
    }
    html += '<section><div class="sec-head"><span class="sec-jp">' + sec.jp + '</span><span class="sec-ko">' + sec.ko + '</span><span class="sec-n">' + n + '</span></div>' +
      (withNotes && sec.note ? '<div class="sec-note">' + sec.note + '</div>' : '') + '<ul>' + items + '</ul></section>';
  });
  return html;
}
function dateLabel(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WD[d.getDay()] + "曜日"; }
function dateKo(d) { return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate(); }

function render() {
  var ti = todayIdx(), root = document.getElementById("sections");
  document.getElementById("tabDay").setAttribute("aria-pressed", view === "day");
  document.getElementById("tabAll").setAttribute("aria-pressed", view === "all");
  document.getElementById("tabBook").setAttribute("aria-pressed", view === "book");
  document.getElementById("dayNav").style.display = view === "day" ? "flex" : "none";
  document.getElementById("q").hidden = view === "day";
  document.getElementById("copyBook").hidden = view !== "book";
  document.getElementById("copyBook").textContent = "목록 복사";
  document.getElementById("app").classList.toggle("quiz", quiz);
  if (view === "day") {
    var di = Math.max(0, Math.min(ti, ti + offset)), d = dateAt(di);
    document.getElementById("dateJp").textContent = dateLabel(d);
    document.getElementById("dateKo").textContent = "Day " + (di + 1) + " · " + dateKo(d) + (di === ti ? " · 오늘" : "");
    document.getElementById("prev").disabled = di <= 0;
    document.getElementById("next").disabled = di >= ti;
    root.innerHTML = dayHTML(di, true);
  } else if (view === "book") {
    var ids = savedList(), bh = "";
    document.getElementById("dateJp").textContent = "내 단어장";
    document.getElementById("dateKo").textContent = "저장한 항목 " + ids.length + "개";
    if (!ids.length) {
      bh = '<div class="sec-note">저장한 항목이 없습니다. 각 항목의 별 버튼을 누르면 여기에 모입니다.</div>';
    } else {
      SECTIONS.forEach(function (sec) {
        var li = "";
        ids.forEach(function (id) {
          var m = id.match(/^ja2:([a-z])(\d+)$/);
          if (m && m[1] === sec.key && POOL[sec.key][+m[2]]) li += itemHTML(sec, +m[2], POOL[sec.key][+m[2]]);
        });
        if (li) bh += '<section><div class="sec-head"><span class="sec-jp">' + sec.jp + '</span><span class="sec-ko">' + sec.ko + '</span></div><ul>' + li + '</ul></section>';
      });
    }
    root.innerHTML = bh;
    applyFilter();
  } else {
    document.getElementById("dateJp").textContent = "누적 노트";
    document.getElementById("dateKo").textContent = "Day 1–" + (ti + 1) + " · 지금까지 배운 내용 전체";
    var html = "";
    for (var i = ti; i >= 0; i--) {
      var dd = dateAt(i);
      html += '<details class="day"' + (i === ti ? " open" : "") + '><summary><span class="day-n">Day ' + (i + 1) + '</span><span class="day-d">' + dateLabel(dd) + '</span><span class="day-c"></span></summary><div class="day-body">' + dayHTML(i, false) + '</div></details>';
    }
    root.innerHTML = html;
    applyFilter();
  }
  updateCounts();
  var left = TOTAL_DAYS - 1 - ti;
  var end = dateAt(TOTAL_DAYS - 1);
  document.getElementById("foot").textContent = left >= 0
    ? "매일 새 내용이 나오는 기간은 Day " + TOTAL_DAYS + "(" + (end.getMonth() + 1) + "/" + end.getDate() + ")까지입니다. 이후에는 앞선 내용이 다시 나옵니다. 스피커 버튼은 일본어 음성입니다."
    : "새 내용은 Day " + TOTAL_DAYS + "까지였고 지금은 복습 주기입니다. 새로 추가하려면 요청해 주세요.";
}
function updateCounts() {
  var all = document.querySelectorAll(".item"), c = 0;
  all.forEach(function (x) { if (x.classList.contains("done")) c++; });
  document.getElementById("progress").innerHTML = "<b>" + c + "</b> / " + all.length + " 완료";
  document.querySelectorAll("details.day").forEach(function (dt) {
    var its = dt.querySelectorAll(".item"), n = 0;
    its.forEach(function (x) { if (x.classList.contains("done")) n++; });
    dt.querySelector(".day-c").textContent = n + " / " + its.length;
  });
}
function applyFilter() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll(".item").forEach(function (x) { x.hidden = !!q && x.getAttribute("data-q").indexOf(q) < 0; });
  document.querySelectorAll("section").forEach(function (s) { s.hidden = !!q && !s.querySelector(".item:not([hidden])"); });
  document.querySelectorAll("details.day").forEach(function (dt) {
    var any = !!dt.querySelector(".item:not([hidden])");
    dt.hidden = !!q && !any;
    if (q && any) dt.open = true;
  });
}

document.getElementById("sections").addEventListener("click", function (e) {
  var item = e.target.closest(".item");
  if (!item) return;
  if (e.target.closest(".star")) {
    var sid = item.getAttribute("data-id"), list = savedList(), pos = list.indexOf(sid);
    if (pos >= 0) list.splice(pos, 1); else list.push(sid);
    setSaved(list);
    if (view === "book") { render(); return; }
    document.querySelectorAll('.item[data-id="' + sid + '"] .star').forEach(function (b) {
      b.classList.toggle("on", pos < 0);
      b.setAttribute("aria-pressed", pos < 0);
    });
    return;
  }
  if (e.target.closest(".say")) { speak(item.getAttribute("data-jp")); return; }
  if (e.target.closest(".chk")) {
    var on = item.querySelector("input").checked;
    store(item.getAttribute("data-id"), on);
    // 같은 항목이 다른 Day에 다시 나오는 경우에도 상태를 맞춘다
    document.querySelectorAll('.item[data-id="' + item.getAttribute("data-id") + '"]').forEach(function (x) {
      x.classList.toggle("done", on);
      x.querySelector("input").checked = on;
    });
    updateCounts();
    return;
  }
  item.classList.toggle("open");
});
document.getElementById("prev").onclick = function () { offset--; render(); };
document.getElementById("next").onclick = function () { offset++; render(); };
document.getElementById("tabDay").onclick = function () { view = "day"; offset = 0; render(); };
document.getElementById("tabAll").onclick = function () { view = "all"; render(); };
document.getElementById("tabBook").onclick = function () { view = "book"; render(); };
document.getElementById("copyBook").onclick = function () {
  var btn = this, lines = [];
  savedList().forEach(function (id) {
    var m = id.match(/^ja2:([a-z])(\d+)$/), it = m && POOL[m[1]] && POOL[m[1]][+m[2]];
    if (it) lines.push(it[0] + "\t" + it[1] + "\t" + it[2]);
  });
  var done = function (ok) { btn.textContent = ok ? "복사됨" : "복사 안 됨"; };
  try { navigator.clipboard.writeText(lines.join("\n")).then(function () { done(true); }, function () { done(false); }); }
  catch (e) { done(false); }
};
document.getElementById("quiz").onclick = function () {
  quiz = !quiz;
  this.setAttribute("aria-pressed", quiz ? "true" : "false");
  document.getElementById("app").classList.toggle("quiz", quiz);
};
document.getElementById("q").addEventListener("input", applyFilter);
render();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
